<script>
  (function () {
    var navButton = document.querySelector('#site-nav button');
    var hiddenLinks = document.getElementById('site-nav-hidden-links');

    if (!navButton || !hiddenLinks) return;

    function syncNavigationState() {
      navButton.setAttribute('aria-expanded', String(!hiddenLinks.classList.contains('hidden')));
    }

    navButton.addEventListener('click', syncNavigationState);
    hiddenLinks.addEventListener('click', function (event) {
      if (event.target.closest('a')) {
        hiddenLinks.classList.add('hidden');
        navButton.classList.remove('close');
        syncNavigationState();
      }
    });
    window.addEventListener('resize', function () {
      window.requestAnimationFrame(syncNavigationState);
    });
    syncNavigationState();
  }());
</script>

    var englishText = {};
    var englishHtml = {};
    var englishAttributes = {};
    var storageKey = "hailong-home-language";

    function rememberEnglish(selector, target, collection) {
      document.querySelectorAll(selector).forEach(function (element) {
        var key = element.getAttribute(target);
        if (!(key in collection)) {
          collection[key] = target === "data-i18n-html" ? element.innerHTML : element.textContent;
        }
      });
    }

    rememberEnglish("[data-i18n]", "data-i18n", englishText);
    rememberEnglish("[data-i18n-html]", "data-i18n-html", englishHtml);

    ["title", "alt", "aria-label"].forEach(function (attribute) {
      var dataAttribute = "data-i18n-" + attribute;
      document.querySelectorAll("[" + dataAttribute + "]").forEach(function (element) {
        var key = element.getAttribute(dataAttribute);
        englishAttributes[attribute + ":" + key] = element.getAttribute(attribute) || "";
      });
    });

    var englishMetadata = {
      title: document.title,
      description: "Hailong Zou is a Ph.D. Student at Peking University working on efficient AI systems, on-device and edge AI, and hardware-software co-design for foundation-model inference.",
      author: "Hailong Zou"
    };
    var chineseMetadata = {
      title: "邹海龙 | 北京大学计算机学院博士生",
      description: "邹海龙是北京大学计算机学院博士生，研究方向包括高效人工智能系统、端侧与边缘智能以及面向基础模型推理的软硬件协同优化。",
      author: "邹海龙"
    };

    function updateMeta(selector, value) {
      var element = document.querySelector(selector);
      if (element) element.setAttribute("content", value);
    }

    function setLanguage(language, updateAddress) {
      var isChinese = language === "zh";
      var dictionary = isChinese ? translations.zh : {};

      document.documentElement.lang = isChinese ? "zh-CN" : "en";

      document.querySelectorAll("[data-i18n]").forEach(function (element) {
        var key = element.getAttribute("data-i18n");
        if (isChinese && dictionary[key] !== undefined) {
          element.textContent = dictionary[key];
        } else if (englishText[key] !== undefined) {
          element.textContent = englishText[key];
        }
      });

      document.querySelectorAll("[data-i18n-html]").forEach(function (element) {
        var key = element.getAttribute("data-i18n-html");
        if (isChinese && dictionary[key] !== undefined) {
          element.innerHTML = dictionary[key];
        } else if (englishHtml[key] !== undefined) {
          element.innerHTML = englishHtml[key];
        }
      });

      document.querySelectorAll("[data-lang-en][data-lang-zh]").forEach(function (element) {
        element.textContent = element.getAttribute(isChinese ? "data-lang-zh" : "data-lang-en");
      });

      ["title", "alt", "aria-label"].forEach(function (attribute) {
        var dataAttribute = "data-i18n-" + attribute;
        document.querySelectorAll("[" + dataAttribute + "]").forEach(function (element) {
          var key = element.getAttribute(dataAttribute);
          var translated = dictionary[key];
          element.setAttribute(attribute, isChinese && translated !== undefined ? translated : englishAttributes[attribute + ":" + key]);
        });
      });

      document.querySelectorAll("[data-language-option]").forEach(function (button) {
        button.setAttribute("aria-pressed", String(button.getAttribute("data-language-option") === language));
      });

      var metadata = isChinese ? chineseMetadata : englishMetadata;
      document.title = metadata.title;
      updateMeta('meta[name="description"]', metadata.description);
      updateMeta('meta[name="author"]', metadata.author);
      updateMeta('meta[property="og:title"]', metadata.title);
      updateMeta('meta[property="og:description"]', metadata.description);
      updateMeta('meta[property="og:locale"]', isChinese ? "zh_CN" : "en_US");
      updateMeta('meta[name="twitter:title"]', metadata.title);
      updateMeta('meta[name="twitter:description"]', metadata.description);

      try {
        window.localStorage.setItem(storageKey, language);
      } catch (error) {
        /* Language switching still works when storage is unavailable. */
      }

      if (updateAddress && window.history && window.history.replaceState) {
        var url = new URL(window.location.href);
        if (isChinese) {
          url.searchParams.set("lang", "zh");
        } else {
          url.searchParams.delete("lang");
        }
        window.history.replaceState({}, "", url.pathname + url.search + url.hash);
      }

      window.dispatchEvent(new CustomEvent("homepage:languagechange", { detail: { language: language } }));
    }

    document.querySelectorAll("[data-language-option]").forEach(function (button) {
      button.addEventListener("click", function () {
        setLanguage(button.getAttribute("data-language-option"), true);
      });
    });

    var initialLanguage = "en";
    try {
      var requestedLanguage = new URL(window.location.href).searchParams.get("lang");
      var storedLanguage = window.localStorage.getItem(storageKey);
      if (requestedLanguage === "zh" || (!requestedLanguage && storedLanguage === "zh")) {
        initialLanguage = "zh";
      }
    } catch (error) {
      /* English remains the no-storage fallback. */
    }
    setLanguage(initialLanguage, initialLanguage === "zh");
  }());
</script>
