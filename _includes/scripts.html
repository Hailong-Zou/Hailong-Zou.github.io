<script src="assets/js/main.min.js"></script>
<script defer src="https://cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js"></script>

<script>
  (function () {
    var navButton = document.querySelector('#site-nav button');
    var hiddenLinks = document.getElementById('site-nav-hidden-links');

    if (!navButton || !hiddenLinks) return;

    function syncNavigationState() {
      navButton.setAttribute('aria-expanded', String(!hiddenLinks.classList.contains('hidden')));
    }

    navButton.addEventListener('click', syncNavigationState);
    hiddenLinks.addEventListener('click', function (event) {
      if (event.target.closest('a')) {
        hiddenLinks.classList.add('hidden');
        navButton.classList.remove('close');
        syncNavigationState();
      }
    });
    window.addEventListener('resize', function () {
      window.requestAnimationFrame(syncNavigationState);
    });
    syncNavigationState();
  }());
</script>

<script>
  (function () {
    var ipOutput = document.getElementById('visitor-public-ip');

    if (!ipOutput || !window.fetch) {
      if (ipOutput) ipOutput.textContent = 'Unavailable';
      return;
    }

    fetch('https://api64.ipify.org?format=json', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('IP request failed');
        return response.json();
      })
      .then(function (data) {
        if (!data || typeof data.ip !== 'string' || data.ip.length > 64) {
          throw new Error('Invalid IP response');
        }
        ipOutput.textContent = data.ip;
      })
      .catch(function () {
        ipOutput.textContent = 'Unavailable';
      });
  }());
</script>
